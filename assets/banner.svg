<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatFast {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes shimmer {
      0% { stop-color: #6366F1; }
      50% { stop-color: #EC4899; }
      100% { stop-color: #6366F1; }
    }
    @keyframes barProgress {
      0% { width: 0; }
      50% { width: 140px; }
      100% { width: 140px; }
    }
    .floating-card1 { animation: floatSlow 6s ease-in-out infinite; }
    .floating-card2 { animation: floatFast 5s ease-in-out infinite 1s; }
    .floating-card3 { animation: floatSlow 7s ease-in-out infinite 2s; }
    .pulse-element { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .dashed-line { stroke-dasharray: 6, 6; animation: dashMove 20s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Spheres -->
  <circle cx="150" cy="80" r="140" fill="#6366F1" opacity="0.18" filter="url(#glow)" class="pulse-element" />
  <circle cx="1050" cy="280" r="160" fill="#EC4899" opacity="0.15" filter="url(#glow)" class="pulse-element" />
  <circle cx="600" cy="180" r="120" fill="#06B6D4" opacity="0.12" filter="url(#glow)" class="pulse-element" />

  <!-- Background Connecting Flow Lines -->
  <path d="M 120 180 Q 300 80 500 180 T 900 180 T 1100 120" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.3" class="dashed-line" />
  <path d="M 80 260 Q 350 320 620 220 T 1120 240" fill="none" stroke="#EC4899" stroke-width="1.2" stroke-opacity="0.25" class="dashed-line" />

  <!-- Main Left Content / Typography -->
  <g transform="translate(60, 50)">
    <!-- Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="14" cy="14" r="5" fill="#10B981" />
      <text x="28" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">POST-SALE DELIVERY &amp; SUCCESS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Customer Onboarding Platform
    </text>

    <!-- Gradient Highlight Under Title -->
    <text x="0" y="106" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">
      Awesome Ecosystem &amp; Directory 🚀
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Implementation Projects • Mutual Action Plans (MAPs) • Customer Portals
    </text>
    <text x="0" y="168" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Time-to-Value Acceleration • CRM Handoffs • In-App Digital Adoption
    </text>

    <!-- Quick Stat Chips -->
    <g transform="translate(0, 205)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">🏢 15+ SaaS</text>
        <text x="72" y="21" fill="#94A3B8" font-family="sans-serif" font-size="11">Leaders</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(145, 0)">
        <rect width="150" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#A855F7" font-family="sans-serif" font-size="12" font-weight="700">💻 13+ Open</text>
        <text x="88" y="21" fill="#94A3B8" font-family="sans-serif" font-size="11">Source</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(305, 0)">
        <rect width="140" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700">⏱️ Rapid TTV</text>
        <text x="94" y="21" fill="#94A3B8" font-family="sans-serif" font-size="11">Workflows</text>
      </g>
    </g>
  </g>

  <!-- Interactive Graphic Floating Cards (Right Side) -->
  
  <!-- Card 1: Mutual Action Plan (Top Right) -->
  <g transform="translate(730, 40)" class="floating-card1" filter="url(#cardGlow)">
    <rect width="210" height="110" rx="12" fill="url(#cardGrad)" stroke="#4F46E5" stroke-width="1.2" stroke-opacity="0.8" />
    <g transform="translate(16, 16)">
      <circle cx="10" cy="10" r="10" fill="#4F46E5" fill-opacity="0.3" />
      <text x="7" y="14" fill="#818CF8" font-family="sans-serif" font-size="11" font-weight="bold">✓</text>
      <text x="28" y="14" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Mutual Action Plan</text>
      
      <text x="0" y="42" fill="#94A3B8" font-family="sans-serif" font-size="10">Milestone 3 / 4 (85%)</text>
      <rect x="0" y="50" width="178" height="6" rx="3" fill="#334155" />
      <rect x="0" y="50" width="150" height="6" rx="3" fill="url(#primaryGrad)" />
      
      <text x="0" y="74" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="600">● 4 Days to Go-Live</text>
    </g>
  </g>

  <!-- Card 2: Client Collaboration Hub (Center Right) -->
  <g transform="translate(950, 110)" class="floating-card2" filter="url(#cardGlow)">
    <rect width="190" height="120" rx="12" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.8" />
    <g transform="translate(16, 16)">
      <circle cx="10" cy="10" r="10" fill="#0891B2" fill-opacity="0.3" />
      <text x="6" y="14" fill="#22D3EE" font-family="sans-serif" font-size="11">🌐</text>
      <text x="26" y="14" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Customer Portal</text>
      
      <rect x="0" y="34" width="158" height="20" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <text x="8" y="48" fill="#CBD5E1" font-family="sans-serif" font-size="9">CRM Sync: Live 🟢</text>
      
      <rect x="0" y="60" width="158" height="20" rx="5" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <text x="8" y="74" fill="#CBD5E1" font-family="sans-serif" font-size="9">Tasks: 18 Completed</text>
    </g>
  </g>

  <!-- Card 3: Time-to-Value Analytics (Bottom Right) -->
  <g transform="translate(710, 180)" class="floating-card3" filter="url(#cardGlow)">
    <rect width="210" height="130" rx="12" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1.2" stroke-opacity="0.7" />
    <g transform="translate(16, 16)">
      <circle cx="10" cy="10" r="10" fill="#BE185D" fill-opacity="0.3" />
      <text x="6" y="14" fill="#F472B6" font-family="sans-serif" font-size="11">⚡</text>
      <text x="26" y="14" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Time-to-Value (TTV)</text>
      
      <!-- Mini Bar Chart -->
      <g transform="translate(0, 36)">
        <rect x="0" y="30" width="22" height="30" rx="3" fill="#475569" />
        <rect x="30" y="20" width="22" height="40" rx="3" fill="#6366F1" />
        <rect x="60" y="10" width="22" height="50" rx="3" fill="#8B5CF6" />
        <rect x="90" y="0" width="22" height="60" rx="3" fill="url(#primaryGrad)" />
        
        <text x="122" y="24" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="800">-42%</text>
        <text x="122" y="42" fill="#94A3B8" font-family="sans-serif" font-size="9">Onboarding</text>
        <text x="122" y="54" fill="#94A3B8" font-family="sans-serif" font-size="9">Duration</text>
      </g>
    </g>
  </g>
</svg>
